<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SNSシェア用OGP画像（差し替え用プレースホルダー）">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9bd6"/>
      <stop offset="1" stop-color="#0a5aa0"/>
    </linearGradient>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="120" height="120" fill="none"/>
      <path d="M0 60H120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="14"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#p)"/>
  <g fill="#ffffff" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
    <text x="48" y="572" font-size="26" font-weight="700" fill-opacity="0.55">ogp-placeholder.svg</text>
    <text x="48" y="602" font-size="18" fill-opacity="0.4">サイト名・キャッチコピー入りの共有画像（1200×630）</text>
  </g>
</svg>
