<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="サービス 引っ越し前後清掃（差し替え用プレースホルダー）">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9bd6"/>
      <stop offset="1" stop-color="#0a5aa0"/>
    </linearGradient>
    <pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="120" height="120" fill="none"/>
      <path d="M0 60H120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="14"/>
    </pattern>
  </defs>
  <rect width="960" height="640" fill="url(#g)"/>
  <rect width="960" height="640" fill="url(#p)"/>
  <g fill="#ffffff" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif">
    <text x="48" y="582" font-size="26" font-weight="700" fill-opacity="0.55">service-moving-placeholder.svg</text>
    <text x="48" y="612" font-size="18" fill-opacity="0.4">空室・原状回復清掃の作業写真（3:2）</text>
  </g>
</svg>
