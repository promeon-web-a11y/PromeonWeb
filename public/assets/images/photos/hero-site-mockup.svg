<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Promeon Web が制作したWebサイトのPC・スマートフォン表示イメージ">
  <title>hero-site-mockup</title>
  <desc>差し替え用: photos/hero-site-mockup.webp（推奨 1600x1000px, WebP）。制作したサイトのPC＋スマホ表示モックアップ。</desc>
  <rect width="1600" height="1000" fill="#FFF7F0"/>
  <g fill="none" stroke="#1c3a5e" stroke-width="6" opacity="0.55">
    <!-- laptop -->
    <rect x="220" y="180" width="900" height="560" rx="20"/>
    <line x1="220" y1="260" x2="1120" y2="260"/>
    <path d="M150 740 h1040 l60 90 h-1160 z" stroke-linejoin="round"/>
  </g>
  <g fill="#1c3a5e" opacity="0.14">
    <rect x="270" y="300" width="800" height="120" rx="8"/>
    <rect x="270" y="450" width="380" height="240" rx="8"/>
    <rect x="690" y="450" width="380" height="240" rx="8"/>
  </g>
  <circle cx="290" cy="222" r="9" fill="#e8672a" opacity="0.7"/>
  <circle cx="320" cy="222" r="9" fill="#1c3a5e" opacity="0.35"/>
  <circle cx="350" cy="222" r="9" fill="#1c3a5e" opacity="0.35"/>
  <!-- phone -->
  <g>
    <rect x="1180" y="360" width="240" height="470" rx="34" fill="#fff" stroke="#1c3a5e" stroke-width="6" opacity="0.7"/>
    <rect x="1210" y="420" width="180" height="70" rx="8" fill="#1c3a5e" opacity="0.14"/>
    <rect x="1210" y="510" width="180" height="130" rx="8" fill="#1c3a5e" opacity="0.14"/>
    <rect x="1210" y="660" width="180" height="40" rx="20" fill="#e8672a" opacity="0.55"/>
  </g>
</svg>
