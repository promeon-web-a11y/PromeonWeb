<circle cx="992" cy="520" r="120" fill="#fff1da" opacity="0.9"/>
<rect x="0" y="640" width="1600" height="360" fill="#16304d" opacity="0.32"/>
<path d="M0 640 L1600 640" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
<g fill="#ffffff" opacity="0.14">
<path d="M0 780 L360 720 L760 790 L1180 700 L1600 780 L1600 1000 L0 1000 Z"/>
</g>
<text x="800" y="930" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="26" fill="#ffffff" opacity="0.6">夕陽をイメージした背景画像（写真素材は要確認）</text>
