<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>料金・プラン｜基本プランと完全オーダーメイド | Promeon Web</title>
    <meta
      name="description"
      content="Promeon WebのWeb制作の料金。標準的な内容をまとめた基本プラン（Mini 49,800円／Standard 99,800円／Pro 149,800円・すべて税込）と、完全オーダーメイド制作（要お見積り）。ページ数・機能・ご要望により料金は変動します。ご相談・お見積りは無料です。"
    />

    <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promeon Web" />
    <meta property="og:title" content="料金・プラン｜基本プランと完全オーダーメイド | Promeon Web" />
    <meta
      property="og:description"
      content="基本プランの比較表と、完全オーダーメイド制作・有料オプションの例をまとめています。相談・見積り無料。"
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:url" content="" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; max-width: 720px; margin: 0 auto; font-family: sans-serif">
        <h1>料金・プラン｜Promeon Web</h1>
        <p>
          基本プラン：Mini 49,800円／Standard 99,800円／Pro 149,800円（すべて税込）。
          ページ数・機能・ご要望により料金は変動します。基本プランに当てはまらない場合は完全オーダーメイド制作（要お見積り）。
          サーバー・ドメイン費用は別。ご相談・お見積りは無料です。お問い合わせ：satokazu.promeon@gmail.com
        </p>
      </div>
    </noscript>

    <div id="site-header"></div>

    <main id="main">
      <section class="section page-intro">
        <div class="container">
          <div data-h1 data-section-head="PRICING|料金・プラン|標準的な制作内容をまとめた「基本プラン」と、ご要望に合わせて設計する「完全オーダーメイド制作」があります。"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="plans-basic-note"></div>
        </div>
      </section>

      <section class="section section-alt">
        <div class="container">
          <ul id="plans-grid" class="pricing-grid pricing-grid--detailed"></ul>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div data-section-head="COMPARE|基本プランの比較|項目ごとの違いを一覧で確認できます。"></div>
          <div id="plans-compare"></div>
          <p class="compare-hint">
            「要相談」の項目は、Standard・Proの内容を個別のヒアリングで確定するものです。事実が未確定の項目に仮の数値は入れていません。
          </p>
        </div>
      </section>

      <section class="section section-warm">
        <div class="container">
          <div class="custom-plan-layout">
            <div
              class="custom-plan-media"
              data-media="customPlanning|1200|800|cover"
              data-media-alt="完全オーダーメイド制作の構成案・ワイヤーフレームのイメージ"
            ></div>
            <div id="plans-custom"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="plans-paid-options"></div>

          <div class="pricing-note">
            <p class="pricing-note-title">補足事項</p>
            <ul id="plans-notes" class="pricing-note-list"></ul>
            <p class="payment-note">
              お支払い方法：<strong id="payment-methods"></strong>
            </p>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
