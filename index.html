<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>チャットだけで、伝わるWebサイトを。｜中小企業向けWeb制作 Promeon Web</title>
    <meta
      name="description"
      content="中小企業・個人事業主向けのホームページを分かりやすい料金で制作。打ち合わせから納品までチャット中心、Miniプラン49,800円（税込）から、スマホ対応。納期はご依頼内容により異なります。ご相談とお見積りは無料です。"
    />

    <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promeon Web" />
    <meta property="og:title" content="チャットだけで、伝わるWebサイトを。｜Promeon Web" />
    <meta
      property="og:description"
      content="中小企業・個人事業主向けのホームページを、分かりやすい料金で。チャット中心・スマホ対応。納期は要相談。相談・見積り無料。"
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:url" content="" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; max-width: 720px; margin: 0 auto; font-family: sans-serif">
        <h1>Promeon Web｜Webサイト制作サービス</h1>
        <p>
          中小企業・個人事業主向けに、チャット中心で依頼できるWebサイト制作サービスです。
          基本プランは Mini（49,800円）・Standard（99,800円）・Pro（149,800円）（すべて税込）。
          料金は内容により変動します。ご相談・お見積りは無料です。お問い合わせ：satokazu.promeon@gmail.com
        </p>
        <p>詳しい内容をご覧いただくには JavaScript を有効にしてください。</p>
      </div>
    </noscript>

    <div id="site-header"></div>

    <main id="main">
      <!-- ファーストビュー（左：文章／右：制作サイトのモックアップ） -->
      <section id="hero" class="hero">
        <div class="container hero-grid">
          <div class="hero-text">
            <h1 id="hero-heading">AIの速さと、人の丁寧さで。</h1>
            <p id="hero-subcopy" class="hero-sub"></p>
            <div class="hero-cta">
              <a href="/contact/" class="btn btn-primary btn-lg">無料相談・無料見積り</a>
              <a href="/samples/" class="btn btn-outline btn-lg">制作サンプルを見る</a>
            </div>
            <p class="hero-cta-note" data-cta-note></p>
            <ul id="hero-badges" class="hero-badges"></ul>
            <p id="hero-caption" class="hero-caption"></p>
          </div>
          <div
            class="hero-media"
            data-media="heroMockup|1600|1000|contain|eager"
            data-media-alt="Promeon Web が制作したWebサイトのPC・スマートフォン表示"
          ></div>
        </div>
      </section>

      <!-- 顧客の悩み -->
      <section id="pains" class="section">
        <div class="container">
          <div data-section-head="CHECK|こんなお悩みはありませんか？|"></div>
          <ul id="home-pains" class="pain-grid"></ul>
          <p id="home-pain-solution" class="pain-solution"></p>
        </div>
      </section>

      <!-- 選ばれる理由（ナビ「サービス」のリンク先） -->
      <section id="reasons" class="section">
        <div class="container">
          <div data-section-head="SERVICE|Promeon Webが選ばれる理由|チャット中心・明確な料金・AI活用の短納期・人による確認。"></div>
          <ul id="home-reasons" class="reasons-grid"></ul>
        </div>
      </section>

      <!-- 制作サンプル -->
      <section id="samples-overview" class="section">
        <div class="container">
          <div data-section-head="SAMPLE|制作サンプル|各プランで作れるWebサイトのイメージです。すべてサービス紹介用の架空サンプルです。"></div>
          <ul id="home-samples" class="card-grid samples-grid"></ul>
          <p class="section-more">
            <a href="/samples/" class="btn btn-outline">制作サンプルを詳しく見る</a>
          </p>
        </div>
      </section>

      <!-- 料金プラン（薄い暖色の背景で区切る） -->
      <section id="plans-overview" class="section section-warm">
        <div class="container">
          <div data-section-head="PRICING|料金プラン|標準的な制作内容をまとめた基本プランです。内容により料金は変動します（すべて税込）。"></div>
          <ul id="home-plans" class="pricing-grid"></ul>
          <p class="section-more">
            <a href="/plans/" class="btn btn-outline">料金・プランを詳しく見る</a>
          </p>
        </div>
      </section>

      <!-- AI活用の説明 -->
      <section id="ai" class="section">
        <div class="container">
          <div data-section-head="AI &amp; HUMAN CHECK|AIの速さと、人の確認を組み合わせて制作します。|AIは下地づくりに活用し、内容と表示は人が確認します。"></div>
          <div class="ai-layout">
            <div
              class="ai-media"
              data-media="processDev|1200|800|cover"
              data-media-alt="サイトを制作しているPC画面（AIを活用したコード制作）"
            ></div>
            <div id="home-ai" class="ai-wrap"></div>
          </div>
        </div>
      </section>

      <!-- 制作の流れ（薄いグレーの背景で区切る） -->
      <section id="flow-overview" class="section section-alt">
        <div class="container">
          <div data-section-head="FLOW|制作の流れ|チャットで相談 → ヒアリングシートに回答 → 制作 → 確認 → 修正・納品。Web会議は不要です。"></div>
          <ol id="home-flow" class="flow-list flow-list--compact"></ol>
          <p class="section-more">
            <a href="/flow/" class="btn btn-outline">制作の流れを詳しく見る</a>
          </p>
        </div>
      </section>

      <!-- よくある質問（薄い暖色の背景で区切る） -->
      <section id="faq-overview" class="section section-warm">
        <div class="container">
          <div data-section-head="FAQ|よくある質問|初めての方から多くいただく質問です。"></div>
          <dl id="home-faq" class="faq-list"></dl>
          <p class="section-more">
            <a href="/faq/" class="btn btn-outline">よくある質問をすべて見る</a>
          </p>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
